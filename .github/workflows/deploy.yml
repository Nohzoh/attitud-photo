name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5

      # Les images déjà redimensionnées sont gardées d'un déploiement à l'autre :
      # seules les nouvelles photos sont traitées.
      - name: Cache des images traitées
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-${{ env.HUGO_VERSION }}-${{ github.sha }}
          restore-keys: hugo-resources-${{ env.HUGO_VERSION }}-

      - name: Construire le site
        run: hugo --minify --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
