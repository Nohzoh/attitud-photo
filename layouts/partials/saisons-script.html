{{/* Dates des saisons (hugo.toml : params.saisons), à la date du visiteur : « mois-jour », ou « paques±N »,
     N jours avant ou après le dimanche de Pâques de l'année en cours. Utilisé par bandeau-cadeau et offres-redirection. */}}
<script>
  window.saisonEnCours = function (debut, fin) {
    const aujourdhui = new Date();
    const annee = aujourdhui.getFullYear();
    const moisJour = (date) => String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    const paques = () => {
      // Calcul grégorien de Pâques (algorithme de Meeus).
      const a = annee % 19, b = Math.floor(annee / 100), c = annee % 100;
      const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
      const mois = Math.floor((h + l - 7 * m + 114) / 31), jour = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(annee, mois - 1, jour);
    };
    const resoudre = (valeur) => {
      const relatif = /^paques([+-]\d+)?$/.exec(valeur);
      if (!relatif) return valeur;
      const date = paques();
      date.setDate(date.getDate() + Number(relatif[1] || 0));
      return moisJour(date);
    };
    const jour = moisJour(aujourdhui);
    return jour >= resoudre(debut) && jour <= resoudre(fin);
  };
</script>
